name = "mg-share"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Googleログイン用：OAuthクライアントID（公開値）。Google Cloud で作成して貼る
# セッション署名鍵は秘密： wrangler secret put SESSION_SECRET
[vars]
GOOGLE_CLIENT_ID = "177151250196-ta2k23m2fe1ac9bras75ajk6ia79h88k.apps.googleusercontent.com"
# Cloudflare Stream（確認用動画の自動トランスコード）。トークンは秘密： wrangler secret put STREAM_API_TOKEN
STREAM_ACCOUNT_ID = "fa27b051015cf14d2a1af3acc35c4d0f"

# 利用者自身のCloudflare Stream接続（BYOC）。
# OAuth clientを公開化して値を設定するまで、UIは「運営設定未完了」と安全に停止する。
# secret: npx wrangler secret put CF_OAUTH_CLIENT_SECRET
APP_ORIGIN = "https://monogataritch.pages.dev"
CF_OAUTH_CLIENT_ID = ""
CF_OAUTH_REDIRECT_URI = "https://mg-share.aki-surf89315.workers.dev/api/cf/oauth/callback"
# OAuth client作成画面で選択した Stream Read / Stream Write のscope IDを空白区切りで設定
CF_OAUTH_SCOPES = ""
# 既存のAK用R2/Streamへフォールバックできる唯一のアカウント
LEGACY_STREAM_OWNER_EMAIL = "aki.surf89315@gmail.com"

# 共有スナップショット＋コメント保存用 KV
# 初回: wrangler kv namespace create SNAPS で id を発行して下記に貼る
[[kv_namespaces]]
binding = "SNAPS"
id = "dae9e99997cc4ad29722f28f4c23476f"

# ものがたりっち案件JSONのクラウド保存用D1。制作進行の正本はStudio OS。
# KV(SNAPS)は put 1,000回/日で07-27に焼き切って編集が消えたので、書込はD1へ移した。
# 読みはD1優先→無ければKVフォールバック（移行期）。詳細は migrations/0003_mg_kv.sql
[[d1_databases]]
binding = "DB"
database_name = "birdflip_ledger"
database_id = "b3746e22-efd9-4026-b967-26086918da05"

# 大容量ファイル転送＋動画レビュー用 R2
# 初回: npx wrangler r2 bucket create mg-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "mg-files"

# 期限切れファイルの自動削除（毎日 UTC18:00 = JST3:00）
[triggers]
crons = ["0 18 * * *"]

# リアルタイム共同編集（共有リンクの編集モード）。SQLite-backed=無料プラン枠
[[durable_objects.bindings]]
name = "LIVEDOC"
class_name = "LiveDoc"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveDoc"]
